name: Python static analysis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Pylint, Bandit, and Flake8
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install analysis tools
        run: python -m pip install --upgrade pylint bandit flake8

      - name: Run Pylint
        run: python -m pylint --fail-under=9.5 theater_system.py

      - name: Run Bandit
        run: python -m bandit -r theater_system.py

      - name: Run Flake8
        run: python -m flake8 theater_system.py
